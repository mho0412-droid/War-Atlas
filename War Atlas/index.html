<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The War Atlas: 1939-1945</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #1a1510;
            --paper: #f5f0e8;
            --gold: #c8941a;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background: var(--paper);
            font-family: 'Libre Baskerville', serif;
            overflow: hidden; /* Focus on map exploration */
        }

        header {
            background: var(--ink);
            color: #d4c8a8;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid var(--gold);
            z-index: 1001;
            position: relative;
        }

        header h1 {
            font-family: 'Oswald', sans-serif;
            margin: 0;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-size: 24px;
        }

        #map-container {
            width: 100%;
            height: calc(100vh - 60px); /* Fill screen minus header */
            background: #dcd1ba;
        }

        /* VINTAGE POPUP STYLING */
        .leaflet-popup-content-wrapper {
            background: var(--paper) !important;
            border-radius: 0px !important;
            border: 2px solid var(--ink);
            box-shadow: 8px 8px 0px rgba(0,0,0,0.15);
            color: var(--ink);
        }

        .leaflet-popup-tip {
            background: var(--paper) !important;
        }

        .popup-header {
            font-family: 'Oswald', sans-serif;
            font-size: 18px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--gold);
            margin-bottom: 8px;
            padding-bottom: 2px;
        }

        .popup-desc {
            font-size: 13px;
            line-height: 1.5;
            margin: 0;
        }

        .popup-image {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border: 1px solid var(--ink);
            margin-bottom: 10px;
            filter: grayscale(100%) contrast(1.1);
        }
    </style>
</head>
<body>

<header>
    <h1>The War Atlas</h1>
</header>

<div id="map-container"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="map.js"></script>

</body>
</html>
