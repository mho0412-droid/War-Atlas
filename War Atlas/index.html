<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The War Atlas</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --ink: #1a1510;
      --paper: #f5f0e8;
      --gold: #c8941a;
      --text: #2a2010;
      --muted: #6a5a40;
      --border: #d0c0a0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Libre Baskerville', serif;
      background: var(--paper);
      color: var(--text);
      line-height: 1.7;
    }

    /* --- MAP STYLING --- */
    #map-section {
      width: 100%;
      height: 450px;
      border-bottom: 2px solid var(--border);
      background: var(--ink); /* Prevents flash of white while map loads */
    }

    .hero {
      background: var(--ink);
      color: #d4c8a8;
      padding: 80px 20px 60px;
      text-align: center;
    }

    .hero h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 42px;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    /* Rest of your existing CSS remains the same... */
    .timeline { max-width: 760px; margin: 60px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 48px; }
    .event { text-decoration: none; color: inherit; border-bottom: 1px solid var(--border); padding-bottom: 24px; display: block; transition: opacity .2s ease; }
    .event:hover { opacity: 0.8; }
    .event img { width: 100%; height: 220px; object-fit: cover; margin-bottom: 14px; filter: grayscale(100%) contrast(1.05); }
    .date { font-family: 'Oswald', sans-serif; font-size: 11px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
    .event h2 { font-family: 'Oswald', sans-serif; font-size: 24px; margin-bottom: 6px; }
    .event p { font-size: 14px; color: #4a3a28; }
    footer { text-align: center; padding: 40px 20px; font-size: 12px; color: #7a6a50; border-top: 1px solid var(--border); margin-top: 60px; }
  </style>
</head>

<body>

<header class="hero">
  <h1>The War Atlas</h1>
  <p>World War II through original photographs and front pages — organized by time.</p>
</header>

<section id="map-section"></section>

<main class="timeline">
  <a href="d-day.html" class="event">
    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Into_the_Jaws_of_Death_23-0455M_edit.jpg" alt="D-Day landing"/>
    <div class="date">June 6, 1944</div>
    <h2>D-Day</h2>
    <p>Allied forces land in Normandy, opening the Western Front.</p>
  </a>
  </main>

<footer>
  The War Atlas · A visual archive of World War II
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="map.js"></script>

</body>
</html>
