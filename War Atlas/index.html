<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The War Atlas</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --ink: #1a1510;
      --paper: #f5f0e8;
      --gold: #c8941a;
      --text: #2a2010;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Libre Baskerville', serif;
      background: var(--paper);
      color: var(--text);
      overflow: hidden; /* Prevents page scrolling so the map is the focus */
    }

    .hero {
      background: var(--ink);
      color: #d4c8a8;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid var(--gold);
    }

    .hero h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 28px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* FULL SCREEN MAP */
    #map-container {
      width: 100vw;
      height: calc(100vh - 80px); /* Fill screen minus header height */
      background: #dcd1ba;
    }

    /* CUSTOM POPUP STYLING */
    .leaflet-popup-content-wrapper {
      border-radius: 0;
      background: var(--paper);
      border: 1px solid var(--ink);
      padding: 5px;
    }

    .popup-img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      filter: grayscale(100%) contrast(1.2);
      margin-bottom: 8px;
      border: 1px solid var(--ink);
    }

    .popup-title {
      font-family: 'Oswald', sans-serif;
      font-size: 16px;
      text-transform: uppercase;
      margin-bottom: 2px;
      display: block;
    }

    .popup-desc {
      font-size: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

<header class="hero">
  <h1>The War Atlas</h1>
</header>

<div id="map-container"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="map.js"></script>

</body>
</html>
